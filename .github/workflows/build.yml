name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (x86_64)
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu
        env:
          TAURI_PRIVATE_KEY: ""

      - name: Build Tauri app (ARM64)
        run: npm run tauri build -- --target aarch64-unknown-linux-gnu
        env:
          TAURI_PRIVATE_KEY: ""

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/markdown-hd
            src-tauri/target/aarch64-unknown-linux-gnu/release/markdown-hd
          retention-days: 5
